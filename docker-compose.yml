version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: /data/compose/{{.Stack.ID}}/www
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: /data/compose/{{.Stack.ID}}/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true