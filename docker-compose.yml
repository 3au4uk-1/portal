version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: /data/compose/{{.Stack.ID}}/files/site-content
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: /data/compose/{{.Stack.ID}}/files/nginx-config/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true