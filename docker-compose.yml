version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: my_website
    ports:
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html  # Монтируем папку html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf  # Монтируем файл конфига
    restart: unless-stopped