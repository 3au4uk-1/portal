version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - html:/usr/share/nginx/html
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped

volumes:
  html:

configs:
  nginx_config:
    file: ./nginx/nginx.conf  # Путь относительно корня репозитория