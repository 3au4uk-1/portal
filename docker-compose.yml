version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: my_website
    ports:
      - "80:80"
    volumes:
      - html:/usr/share/nginx/html  # Том 'html' (должен быть объявлен ниже)
      - nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

volumes:  # Объявляем том 'html'
  html: