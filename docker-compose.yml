version: '3.8'

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: /data/compose/{{.Stack.ID}}/html  # Магический путь Portainer
        target: /usr/share/nginx/html
      - type: bind
        source: /data/compose/{{.Stack.ID}}/nginx.conf
        target: /etc/nginx/conf.d/default.conf