version: '3.8'  # Обязательно с отступом слева и двоеточием

services:  # Ключевой элемент, должен быть на верхнем уровне
  web:
    image: nginx:alpine  # Правильный отступ (2 пробела)
    ports:
      - "80:80"  # Элементы списка с "-"
    volumes:
      - ./html:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped