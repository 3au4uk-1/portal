version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: my_website
    ports:
      - "80:80"
    volumes:
      - html_volume:/usr/share/nginx/html  # Именованный том для HTML
      - nginx_config:/etc/nginx/conf.d/default.conf  # Именованный том для конфига
    restart: unless-stopped

volumes:
  html_volume:  # Явное объявление тома для HTML
  nginx_config:  # Явное объявление тома для конфига
    driver: local
    driver_opts:
      type: none
      device: ./nginx/nginx.conf  # Указываем путь к файлу
      o: bind