name: Docker Image CI for GHCR

on:
  push:
    branches:
      - main

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build and push image
        run: |
          docker login --username 3au4uk-1 --password ${{ secrets.GH_PAT }} ghcr.io
          docker build . --tag ghcr.io/3au4uk-1/portal:latest
          docker push ghcr.io/3au4uk-1/portal:latest
